name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $project = "TDNHCS/TDNHCS.csproj"
          $content = Get-Content $project -Raw
          $content = $content -replace '<Version>[^<]+</Version>', "<Version>$version</Version>"
          Set-Content -Path $project -Value $content -Encoding UTF8
          ./scripts/BuildInstaller.ps1 -InnoCompilerPath "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TDNHCS_Setup.exe
          generate_release_notes: true
